<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!--
      Content-Security-Policy（読み込んでよい先の許可リスト）
      ここに書いていない場所からは、スクリプトも画像も一切読み込まれない。
      万一どこかに不正なコードが混入しても、外部へデータを送り出せないようにするための保険。
      許可している宛先は以下の2つだけで、いずれもこのアプリが実際に使っているもの:
        - accounts.google.com                      … Googleログイン（同期を使うときだけ）
        - www.googleapis.com                       … Googleドライブの読み書き（同上）
      ⚠️ 書体（Zen Maru Gothic）の宛先はここに戻さないこと。2026-11-10 まで
         Google Fonts の 2 つの宛先を許可して実行時に読んでいたが、
         いまは自分のところから配っている（下の fonts.css）。Google ドライブ同期を
         使わない学校では、外への通信は 1 つも出ない。
      style-src の 'unsafe-inline' は、画面のCSSを実行時に <style> として差し込む
      React + Tailwind の構成上どうしても必要なため残している。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://accounts.google.com https://www.googleapis.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src https://accounts.google.com; base-uri 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 書体は自分のところから配る（生成物。npm run build:fonts で作り直す）。
         ⚠️ Google Fonts を実行時に読む形に戻さないこと。学校のフィルタが塞ぐと、
            塞がり方が「拒否」ではなく「握ったまま返さない」ときに、<style> の中の
            @import が終わらず、**その <style> に書いた印刷用の CSS まで効かなくなる**。
            収録していない字（先生が打った珍しい漢字など）は端末のフォントに落ちる。
            書体が変わるだけで、□ にはならない。 -->
    <link rel="stylesheet" href="./fonts.css" />
    <meta name="description" content="小学校のノート指導用の見本（板書計画）を作成・印刷できるツール" />
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GIGA school">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="ノート見本作成ツール PRO">
    <meta property="og:description" content="小学校のノート指導用の見本（板書計画）を作成・印刷できるツール">
    <meta property="og:url" content="https://notebooksample-generator.giga-school.com/">
    <meta property="og:image" content="https://giga-school.com/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#047857" />
    <!-- PWA: ホーム画面に追加してアプリとして起動できるようにする -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ノート見本" />
    <meta name="format-detection" content="telephone=no" />
    <title>ノート見本作成ツール PRO</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- 利用規約・プライバシーへの行き先。中身は正本の部品
         standards/web/giga-app-links.js（配布物 public/giga-app-links.js）が、
         src/App.jsx のフッターに置いた <span data-giga-links> の中に出す。
         data-links は置き場所の側に書いてある。 -->
    <script src="/giga-app-links.js" defer></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
