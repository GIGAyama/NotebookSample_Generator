name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 先生や児童の端末に配られるライブラリに、既知の脆弱性が無いか確かめる。
      # ここで止まったら、直すまでデプロイしない。
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      # 必須ファイルの欠落・秘密情報の混入・コンフリクト痕の残りなどを機械的に確かめる。
      # 検査の中身は GIGA 共通の正本（SchoolPlan_Editor）と同一。
      - name: Project quality gate
        run: npm run check

      # ノートが消えないこと・見本の組み立てが変わらないことを守るためのテスト。
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Google ドライブ同期用の OAuth クライアントID（公開情報・シークレットではない）。
          # リポジトリの Settings > Secrets and variables > Actions > Variables に
          # VITE_GOOGLE_CLIENT_ID を登録すると有効化されます。未設定でもビルドは通り、
          # 同期機能だけが無効表示になります。詳しくは docs/google-drive-sync.md を参照。
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
